<!DOCTYPE html>
<html lang="ja">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-C34PHRSJN4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag("js", new Date());
    gtag("config", "G-C34PHRSJN4");
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>土地家屋調査士 過去問アプリ</title>
  <meta name="description" content="土地家屋調査士試験の過去問を年度順、復習、タイムアタックで学習できるクイズアプリです。" />
  <link rel="stylesheet" href="style.css?v=1.4">
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
</head>
<body>
  <main class="title-page">
    <h1>土地家屋調査士<br>過去問アプリ</h1>
    <p class="subtitle">年度順・復習・タイムアタック</p>

    <div id="top-progress-info" class="progress-panel">進捗を読み込み中...</div>

    <div id="mode-select">
      <button id="start-normal-btn" class="mode-btn normal-mode">年度順モード</button>
      <button id="start-review-btn" class="mode-btn review-mode">復習モード</button>
      <button id="start-timeattack-btn" class="mode-btn ta-mode">タイムアタック（5分）</button>
    </div>

    <footer>
      <p style="text-align: left; line-height: 1.6;">
        復習モードは、開始時点の復習対象を年度順に一通り出題します。3回連続で正解すると復習完了です。<br>
        タイムアタックは、間違えると残り時間が20秒減ります。
      </p>
      <p>
        <a href="https://x.com/ryota_totikao" target="_blank">@ryota_totikao</a>
      </p>
      <p style="text-align: left; line-height: 1.6; font-size: 0.8em; margin-top: 20px;">
        本アプリの過去問は、法務省「土地家屋調査士試験」に基づきます。<br>
        問題文の著作権は法務省に帰属します。<br>
        本サイトは個人の学習支援を目的とした非公式なものです。
      </p>
    </footer>
  </main>

  <script>
    const LEARNING_STATE_KEY = "learningStateByLabel";

    function loadLearningState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(LEARNING_STATE_KEY) || "{}");
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch {
        return {};
      }
    }

    function getProgress(questions) {
      const state = loadLearningState();
      const getResult = q => state[q.label]?.lastResult || null;
      return {
        total: questions.length,
        unanswered: questions.filter(q => !["correct", "wrong", "unknown"].includes(getResult(q))).length,
        review: questions.filter(q => ["wrong", "unknown"].includes(getResult(q))).length,
        completed: questions.filter(q => getResult(q) === "correct").length
      };
    }

    function updateTopProgress() {
      const area = document.getElementById("top-progress-info");
      fetch("questions.json")
        .then(res => res.json())
        .then(questions => {
          const p = getProgress(questions.filter(q => q.label));
          area.textContent = `全${p.total}問 / 未回答${p.unanswered}問 / 復習${p.review}問 / 完了${p.completed}問`;
        })
        .catch(() => {
          area.textContent = "進捗を読み込めませんでした。";
        });
    }

    document.getElementById("start-normal-btn").addEventListener("click", () => {
      localStorage.setItem("quizMode", "year");
      window.location.href = "question-list.html";
    });

    document.getElementById("start-review-btn").addEventListener("click", () => {
      localStorage.setItem("quizMode", "review");
      window.location.href = "quiz.html";
    });

    document.getElementById("start-timeattack-btn").addEventListener("click", () => {
      localStorage.setItem("quizMode", "timeattack");
      window.location.href = "quiz.html";
    });

    updateTopProgress();
  </script>
</body>
</html>
